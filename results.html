<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Nav -->
  <nav>
    <a class="nav-logo" href="index.html">
      <span class="logo-dot"></span>

      <h2 id="clip-title">Loading…</h2>
      <p id="clip-description"></p>

    <!-- Video player -->
    <div class="video-container" id="video-container">
      <video
        id="clip-video"
        controls
        playsinline
        preload="metadata"
        aria-label="Clip video"
      ></video>

      <!-- Pause overlay -->
      <div class="pause-overlay" id="pause-overlay">

    <!-- Question -->
    <div class="question-section" id="question-section" hidden>

    </div>

    <!-- Results (hidden until reveal) -->
    <div class="results-panel" id="results-panel" aria-live="polite">
      <!-- Injected by JS -->
    </div>

  </main>

  <footer>
    <p>WorldModelDemo · MMToM-QA Theory of Mind comparison demo</p>
